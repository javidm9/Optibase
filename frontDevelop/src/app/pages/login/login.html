<!-- Pantalla de login. El formulario usa (submit) + preventDefault en vez de un button type=submit
     para poder controlar el flujo con el método entrar() del componente -->
<div class="h-screen w-full bg-gray-100 text-gray-950 p-6 md:p-10 flex flex-col font-sans overflow-hidden box-border">

  <header class="flex flex-shrink-0 items-start justify-between gap-8 border-b-4 border-gray-950 pb-4">
    <div>
      <img src="/logo.png" alt="Optibase" class="h-10 md:h-12 w-auto mb-2 block object-contain">
      <h1 class="text-4xl md:text-6xl font-black tracking-tighter leading-none text-gray-950">
        ADMIN<span class="text-blue-600">_</span>
      </h1>
    </div>
    <div class="text-right mt-1 font-mono text-xs tracking-wider text-gray-500">
      <span class="block">BUILD V21.4</span>
      <span class="block">DOCKERIZED BACKEND</span>
    </div>
  </header>

  <form (submit)="entrar(); $event.preventDefault()"
    class="flex-grow flex flex-col justify-center max-w-4xl w-full mx-auto space-y-8 md:space-y-12">

    <div class="group border-b-4 border-gray-950 focus-within:border-blue-600 transition-colors duration-200">
      <label class="block text-xs font-bold uppercase tracking-widest text-gray-500 mb-1">IDENTIFICADOR DE
        ACCESO</label>
      <input [(ngModel)]="usuario" name="usuario" type="text" placeholder="[ingrese id]"
        class="w-full text-3xl md:text-5xl font-black tracking-tight text-gray-950 bg-transparent border-none p-0 pb-1 focus:ring-0 placeholder:text-gray-300">
    </div>

    <div class="group border-b-4 border-gray-950 focus-within:border-blue-600 transition-colors duration-200">
      <label class="block text-xs font-bold uppercase tracking-widest text-gray-500 mb-1">CÓDIGO DE SEGURIDAD
        (KEY)</label>
      <input [(ngModel)]="password" name="password" type="password" placeholder="••••••••"
        class="w-full text-3xl md:text-5xl font-black tracking-tight text-gray-950 bg-transparent border-none p-0 pb-1 focus:ring-0 placeholder:text-gray-300">
    </div>

    <div *ngIf="errorMsg" class="font-mono text-xs font-bold text-red-500 tracking-widest uppercase">
      ERROR: {{errorMsg}}
    </div>

    <div class="pt-4 md:pt-8">
      <button type="submit"
        class="w-full md:w-auto px-12 py-6 bg-gray-950 text-white font-black text-2xl md:text-3xl tracking-tighter hover:bg-blue-600 active:scale-95 transition-all duration-150 inline-block rounded-none shadow-none">
        ACCEDER AL SISTEMA >
      </button>
    </div>

  </form>

  <footer
    class="flex-shrink-0 border-t-2 border-gray-300 pt-4 flex items-end justify-between text-[10px] md:text-xs font-mono text-gray-400">
    <span>FRANCISCO JAVIER DÍAZ MARTÍNEZ / Optibase</span>
  </footer>

</div>
