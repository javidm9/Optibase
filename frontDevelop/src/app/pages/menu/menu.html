<div class="h-screen w-full bg-gray-100 text-gray-950 p-6 md:p-10 flex flex-col font-sans overflow-hidden box-border">

  <header class="flex shrink-0 items-end justify-between gap-8 border-b-4 border-gray-950 pb-4">
    <div>
      <h1 class="text-4xl md:text-6xl font-black tracking-tighter leading-none text-gray-950 uppercase">
        Panel<span class="text-blue-600">_</span>Control
      </h1>
      <p class="mt-2 font-mono text-xs tracking-wider text-gray-500 font-bold">SELECCIONE MÓDULO DE GESTIÓN</p>
    </div>
    <div class="text-right pb-1">
      <button (click)="salir()" class="font-mono text-xs font-bold text-gray-500 hover:text-gray-950 border-b-2 border-transparent hover:border-gray-950 transition-colors uppercase tracking-widest cursor-pointer">
        [ CERRAR SESIÓN ]
      </button>
    </div>
  </header>

  <main class="grow flex items-center justify-center py-8">
    <div class="w-full max-w-6xl grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">

      <button (click)="irAClientes()" class="group text-left border-4 border-gray-950 p-6 md:p-8 flex flex-col justify-between min-h-[220px] hover:bg-gray-950 transition-colors duration-150 rounded-none shadow-none cursor-pointer">
        <div>
          <span class="font-mono text-xs font-bold text-blue-600 block mb-2 tracking-widest">MOD_01</span>
          <h2 class="text-4xl font-black tracking-tighter text-gray-950 group-hover:text-white uppercase leading-none">Clientes</h2>
        </div>
        <div class="flex justify-between items-end mt-8">
          <span class="font-mono text-[10px] text-gray-500 group-hover:text-gray-400 uppercase tracking-widest">Historial Médico<br>Altas y Bajas</span>
          <span class="text-4xl text-gray-950 group-hover:text-white font-black group-hover:translate-x-2 transition-transform duration-200 leading-none">-></span>
        </div>
      </button>

      <button (click)="irACitas()" class="group text-left border-4 border-gray-950 p-6 md:p-8 flex flex-col justify-between min-h-[220px] hover:bg-gray-950 transition-colors duration-150 rounded-none shadow-none cursor-pointer">
        <div>
          <span class="font-mono text-xs font-bold text-blue-600 block mb-2 tracking-widest">MOD_02</span>
          <h2 class="text-4xl font-black tracking-tighter text-gray-950 group-hover:text-white uppercase leading-none">Citas</h2>
        </div>
        <div class="flex justify-between items-end mt-8">
          <span class="font-mono text-[10px] text-gray-500 group-hover:text-gray-400 uppercase tracking-widest">Agenda Clínica<br>Calendario</span>
          <span class="text-4xl text-gray-950 group-hover:text-white font-black group-hover:translate-x-2 transition-transform duration-200 leading-none">-></span>
        </div>
      </button>

      <button (click)="irAInventario()" class="group text-left border-4 border-gray-950 p-6 md:p-8 flex flex-col justify-between min-h-[220px] hover:bg-gray-950 transition-colors duration-150 rounded-none shadow-none cursor-pointer">
        <div>
          <span class="font-mono text-xs font-bold text-blue-600 block mb-2 tracking-widest">MOD_03</span>
          <h2 class="text-4xl font-black tracking-tighter text-gray-950 group-hover:text-white uppercase leading-none">Inventario</h2>
        </div>
        <div class="flex justify-between items-end mt-8">
          <span class="font-mono text-[10px] text-gray-500 group-hover:text-gray-400 uppercase tracking-widest">Stock Material<br>Proveedores</span>
          <span class="text-4xl text-gray-950 group-hover:text-white font-black group-hover:translate-x-2 transition-transform duration-200 leading-none">-></span>
        </div>
      </button>

    </div>
  </main>

  <footer class="shrink-0 border-t-2 border-gray-300 pt-4 flex items-end justify-between text-[10px] md:text-xs font-mono text-gray-400">
    <span>SISTEMA EN LÍNEA // ENTORNO PROD</span>
    <span class="font-bold text-gray-900 hidden sm:inline">OPTIBASE ERP CORE</span>
  </footer>

</div>
