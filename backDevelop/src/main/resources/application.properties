spring.application.name=Optibase

# Perfil activo (sobreescribir con variable de entorno SPRING_PROFILES_ACTIVE en produccion)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# 1. Conexion a la Base de Datos
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/optibase_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# 2. Configuracion de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 3. Mostrar las consultas SQL en la consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 4. Puerto del servidor
server.port=8080

# 5. JWT (secreto y expiracion inyectados via variable de entorno)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# 6. CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}
