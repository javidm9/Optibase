# ==============================================================
# Perfil de produccion (Railway / contenedor Docker)
# Todos los valores sensibles se inyectan como variables de entorno.
# Este fichero NO contiene credenciales y puede estar en el repositorio.
# ==============================================================

# 1. Conexion a la Base de Datos (Railway MySQL plugin o servicio externo)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# 2. Configuracion de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Desactivar log de SQL en produccion
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# 3. Puerto del servidor
# Railway asigna un puerto dinamico mediante la variable PORT.
# Si PORT no esta definida, se usa 8080 como valor por defecto.
server.port=${PORT:8080}

# 4. JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# 5. CORS — debe apuntar a la URL publica del frontend en Railway
app.cors.allowed-origins=${CORS_ORIGINS}
