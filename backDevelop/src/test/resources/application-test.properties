# ============================================================
# Configuracion de tests — H2 en memoria, perfil "test"
# ============================================================

# Base de datos H2 en memoria (modo MySQL para compatibilidad)
spring.datasource.url=jdbc:h2:mem:optibase_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Crear esquema al arrancar y destruirlo al cerrar
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# JWT de prueba (clave base64, minimo 256 bits)
jwt.secret=dGVzdFNlY3JldEtleUZvck9wdGliYXNlVW5pdFRlc3RzMjAyNVNlY3VyZUtleQ==
jwt.expiration=3600000

# CORS
app.cors.allowed-origins=http://localhost:4200
